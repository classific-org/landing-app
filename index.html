<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <!--app-head-->
        <style id="intro-styles">
            /* Signature intro. Critical CSS: it must apply before the app bundle loads. */
            .intro {
                display: none;
            }
            html.intro-pending {
                overflow: hidden;
            }
            html.intro-pending .intro,
            .intro.intro-exit {
                position: fixed;
                inset: 0;
                z-index: 200;
                display: grid;
                place-items: center;
                background: #070707;
            }
            /* The curtain fades away once the signature is written; the hero sharpens behind it. */
            .intro.intro-exit {
                opacity: 0;
                transition: opacity 700ms cubic-bezier(0.4, 0, 0.2, 1);
            }
            .intro-signature {
                width: min(78vw, 980px);
                height: auto;
                overflow: visible;
                transition:
                    opacity 500ms ease,
                    transform 700ms ease;
            }
            .intro-exit .intro-signature {
                opacity: 0;
                transform: scale(0.985);
            }
            /* A clear pen line in the thread's signal blue, heavy enough to read at a glance. */
            .intro-ink {
                fill: none;
                stroke: #3b6dff;
                stroke-width: 1.1;
                stroke-linecap: round;
                stroke-linejoin: round;
                stroke-dasharray: 1 2;
                stroke-dashoffset: 1.05;
                animation-name: introDraw;
                animation-timing-function: linear;
                animation-fill-mode: both;
            }
            @media (max-width: 700px) {
                .intro-ink {
                    stroke-width: 2;
                }
            }
            /* The dots of the i's, set down as the pen passes. */
            .intro-dot {
                fill: #3b6dff;
                opacity: 0;
                animation: introDot 160ms ease-out both;
            }
            @keyframes introDot {
                to {
                    opacity: 1;
                }
            }
            /* Each stroke stays invisible until the pen reaches it, then draws itself in. */
            @keyframes introDraw {
                0% {
                    opacity: 0;
                    stroke-dashoffset: 1.05;
                }
                2% {
                    opacity: 1;
                    stroke-dashoffset: 1.03;
                }
                100% {
                    opacity: 1;
                    stroke-dashoffset: 0;
                }
            }
            /* Hold the hero's entrance until the curtain lifts, then let it play from the start. */
            html.intro-pending
                :is(
                    .enter,
                    .enter-fade,
                    .page-enter,
                    .page-thread,
                    .hero-scroll-arrow,
                    .hero-thread-line,
                    .hero-thread-start,
                    .hero-thread-ring,
                    .hero-thread-node,
                    [data-split="load"] .split-inner
                ) {
                animation: none !important;
            }
            @media (prefers-reduced-motion: reduce) {
                .intro {
                    display: none !important;
                }
            }
        </style>
        <script>
            /* Show the signature intro on a normal load of the home page, unless motion is reduced.
               The guard timer lifts it anyway if the app never starts. */
            (function () {
                try {
                    var root = document.documentElement;
                    var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
                    if (location.pathname === "%BASE_URL%" && location.hash) {
                        /* A link to a section: the home page opens there (see HomePage), so
                           the browser must not put back an older position over it. */
                        if ("scrollRestoration" in history) {
                            history.scrollRestoration = "manual";
                        }
                    }
                    if (location.pathname === "%BASE_URL%" && !location.hash && !reduced) {
                        /* Every visit to the home page (unless it links to a section, which it
                           opens at instead), reloads included, starts at the top and
                           plays through: the intro, then the hero and its thread, with the page
                           held still until the thread has drawn (see HeroThread). */
                        if ("scrollRestoration" in history) {
                            history.scrollRestoration = "manual";
                        }
                        window.scrollTo(0, 0);
                        root.classList.add("intro-pending", "hero-playing");
                        setTimeout(function () {
                            root.classList.remove("intro-pending");
                            var overlay = document.getElementById("intro");
                            if (overlay) {
                                overlay.remove();
                            }
                        }, 7000);
                        setTimeout(function () {
                            root.classList.remove("hero-playing");
                        }, 14000);
                    }
                } catch (error) {}
            })();
        </script>
    </head>
