<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <!--app-head-->
        <style id="intro-styles">
            /* Signature intro. Critical CSS: it must apply before the app bundle loads. */
            .intro {
                display: none;
            }
            html.intro-pending {
                overflow: hidden;
            }
            html.intro-pending .intro,
            .intro.intro-exit {
                position: fixed;
                inset: 0;
                z-index: 200;
                display: grid;
                place-items: center;
                background: #0a0b0d;
            }
            /* The curtain: it lifts away with a hairline of the accent colour along its edge. */
            .intro.intro-exit {
                transform: translateY(-100%);
                box-shadow: 0 1px 0 rgb(36 91 219 / 0.55);
                transition: transform 1100ms cubic-bezier(0.76, 0, 0.24, 1);
            }
            .intro-signature {
                width: min(78vw, 980px);
                height: auto;
                overflow: visible;
                transition: opacity 420ms ease;
            }
            .intro-exit .intro-signature {
                opacity: 0;
            }
            /* A thin pen line, written one stroke after another. */
            .intro-ink {
                fill: none;
                stroke: #245bdb;
                stroke-width: 0.75;
                stroke-linecap: round;
                stroke-linejoin: round;
                stroke-dasharray: 1 2;
                stroke-dashoffset: 1.05;
                animation-name: introDraw;
                animation-timing-function: linear;
                animation-fill-mode: both;
            }
            @media (max-width: 700px) {
                .intro-ink {
                    stroke-width: 1.6;
                }
            }
            /* Each stroke stays invisible until the pen reaches it, then draws itself in. */
            @keyframes introDraw {
                0% {
                    opacity: 0;
                    stroke-dashoffset: 1.05;
                }
                2% {
                    opacity: 1;
                    stroke-dashoffset: 1.03;
                }
                100% {
                    opacity: 1;
                    stroke-dashoffset: 0;
                }
            }
            /* Hold the hero's entrance until the curtain lifts, then let it play from the start. */
            html.intro-pending
                :is(
                    .enter,
                    .enter-fade,
                    .page-enter,
                    .page-thread,
                    .hero-scroll-arrow,
                    .hero-thread-line,
                    .hero-thread-start,
                    .hero-thread-ring,
                    .hero-thread-node,
                    [data-split="load"] .split-inner
                ) {
                animation: none !important;
            }
            @media (prefers-reduced-motion: reduce) {
                .intro {
                    display: none !important;
                }
            }
        </style>
        <script>
            /* Show the signature intro on a normal load of the home page, unless motion is reduced.
               The guard timer lifts it anyway if the app never starts. */
            (function () {
                try {
                    var root = document.documentElement;
                    var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
                    if (location.pathname === "%BASE_URL%" && !reduced) {
                        root.classList.add("intro-pending");
                        setTimeout(function () {
                            root.classList.remove("intro-pending");
                            var overlay = document.getElementById("intro");
                            if (overlay) {
                                overlay.remove();
                            }
                        }, 7000);
                    }
                } catch (error) {}
            })();
        </script>
    </head>
