name: CI

on:
    push:
    pull_request:
    # Sent by the Classific API when published blogs or projects change, so the site is rebuilt.
    repository_dispatch:
        types: [cms-content-updated]
    workflow_dispatch:

jobs:
    check:
        # Content changes do not alter the code, so they skip straight to the deploy.
        if: github.event_name != 'repository_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            SITE_ORIGIN: https://www.classific.example
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.2"
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Install Playwright browsers
              run: bunx playwright install --with-deps chromium
            - name: Lint
              run: bun run lint
            - name: Typecheck
              run: bun run typecheck
            - name: Unit tests with coverage
              run: bun run test:coverage
            - name: Production build
              run: bun run build
            - name: SEO file checks
              run: |
                  test -f dist/robots.txt
                  test -f dist/sitemap.xml
                  test -f dist/llms.txt
                  test -f dist/llms-full.txt
                  test -f dist/og/classific-og.png
                  ! grep -E "localhost|127\\.0\\.0\\.1" dist/robots.txt dist/sitemap.xml dist/llms.txt dist/llms-full.txt
                  grep -q "https://www.classific.example/sitemap.xml" dist/robots.txt
                  grep -q "https://www.classific.example/services/web-applications" dist/sitemap.xml
            - name: End-to-end tests
              run: bun run test:e2e

    deploy:
        # Publishes to GitHub Pages only from main, and only once every check has passed.
        needs: check
        # Runs after the checks pass on main, or on its own when the CMS reports new content
        # (the check job is skipped then, which counts as satisfied).
        if: >-
            !cancelled() && (needs.check.result == 'success' || needs.check.result == 'skipped') &&
            (github.event_name == 'repository_dispatch' ||
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            pages: write
            id-token: write
        concurrency:
            group: pages
            cancel-in-progress: false
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.2"
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Configure Pages
              uses: actions/configure-pages@v5
            - name: Build for GitHub Pages
              # Reads published blogs and projects from the CMS (when CMS_API_URL is set), derives
              # the origin and base path, builds, and verifies the output.
              run: bun run deploy:pages
              env:
                  # Repository variable (Settings > Secrets and variables > Actions > Variables).
                  CMS_API_URL: ${{ vars.CMS_API_URL }}
            - name: Upload site
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
